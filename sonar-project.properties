sonar.projectKey=domits1_Domits
sonar.organization=domits1

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Domits
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=./frontend/web/src,./frontend/app/Domits/src,./backend

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclude compiled output, dependencies, and generated files
sonar.exclusions=**/index.css,**/index.css.map,**/node_modules/**,**/build/**,**/dist/**

# Suppress S6747 (JSX unknown property) across the frontend — Sonar's JSX parser
# misreads expression content and attribute values as property names (false positives)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S6747
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/web/src/**/*.js
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S6747
sonar.issue.ignore.multicriteria.e2.resourceKey=frontend/web/src/**/*.jsx

# Suppress S2068 (hard-coded credentials) for i18n content files — the rule's keyword
# heuristic flags any string near the word "password", so translated UI labels like
# "Nieuw wachtwoord" (New password) get misread as literal credentials.
sonar.issue.ignore.multicriteria.e3.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.e3.resourceKey=frontend/web/src/content/**/*.json

# Suppress S2068 for usePasswordChange.test.js — literal password-shaped fixture
# strings ("oldPass1!", "newPass1!", ...) sit right next to variables named
# currentPassword/newPassword, tripping the same keyword heuristic. These are test
# fixtures, not real secrets.
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e4.resourceKey=frontend/web/src/tests/settings/usePasswordChange.test.js
