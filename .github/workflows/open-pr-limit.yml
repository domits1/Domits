name: Repository-wide Open Pull Request Limit

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  enforce-open-pr-limit:
    name: Enforce 30 open PR maximum
    runs-on: ubuntu-latest
    steps:
      - name: Close newly opened PR when repository limit is exceeded
        uses: actions/github-script@v7
        with:
          script: |
            const maxOpenPullRequests = 30;
            const pullNumber = context.payload.pull_request?.number;

            if (!Number.isInteger(pullNumber)) {
              core.setFailed("The pull request number is missing from the event payload.");
              return;
            }

            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const currentPullRequest = openPullRequests.find(
              (pullRequest) => pullRequest.number === pullNumber
            );

            if (!currentPullRequest) {
              core.info("The pull request is no longer open. No action is needed.");
              return;
            }

            if (openPullRequests.length <= maxOpenPullRequests) {
              core.info(
                `Repository has ${openPullRequests.length}/${maxOpenPullRequests} open pull requests.`
              );
              return;
            }

            const message = [
              "### Repository-wide open pull request limit reached",
              "",
              `This repository currently has **${openPullRequests.length} open pull requests**, including this one.`,
              `The maximum is **${maxOpenPullRequests} open pull requests** total across all contributors.`,
              "",
              "This newly opened pull request has been automatically closed. Existing pull requests are not changed by this automation, and the source branch is not deleted.",
              "",
              "Please merge or close existing pull requests until the repository has **29 or fewer** open pull requests. You can then reopen this pull request or create a new one.",
            ].join("\n");

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body: message,
              });
            } catch (error) {
              core.warning(`Could not add the explanation comment: ${error.message}`);
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              state: "closed",
            });

            core.warning(
              `Closed newly opened PR #${pullNumber}: repository has ${openPullRequests.length} open PRs; limit is ${maxOpenPullRequests}.`
            );
