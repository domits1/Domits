# Two symmetric feed-test files. Their shared setup already lives in
# backend/test/PropertyHandler/support/listingQueryTestHelpers.js; what remains
# duplicated is the parallel call-site shape, not copy-pasted logic. Same reasoning as the
# sonar-project.properties exclusion, which Automatic Analysis mode does not read.
# Hand-run Aurora DSQL migrations repeat every statement for the test and main schemas by
# convention, and plain SQL has no way to share them, so their SQL files are excluded too.
sonar.cpd.exclusions=backend/test/PropertyHandler/propertyRepository.getActiveProperties.test.js,backend/test/PropertyHandler/propertyLocationRepository.getActivePropertiesByCountry.test.js,backend/ORM/migrations/**/*.sql
